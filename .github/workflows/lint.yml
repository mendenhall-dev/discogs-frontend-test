name: lint

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/.eslintrc.yml"
      - .github/actions/setup-node/**
      - .github/workflows/eslint.yml
      - package.json
      - tsconfig.json
      - tsconfig.node.json
      - yarn.lock
  push:
    branches:
      - main

jobs:
  eslint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: yarn lint
