name: lint

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/.eslintrc.yml"
      - .github/actions/setup-node/**
      - .github/workflows/eslint.yml
      - package.json
      - tsconfig.json
      - tsconfig.node.json
      - yarn.lock
  push:
    branches:
      - main

jobs:
  eslint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-node
      - run: yarn lint
