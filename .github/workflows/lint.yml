name: lint

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/.eslintrc.yml"
      - .github/actions/setup-node/**
      - .github/workflows/eslint.yml
      - package.json
      - tsconfig.json
      - tsconfig.node.json
      - yarn.lock
  push:
    branches:
      - main

jobs:
  eslint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node
      - run: yarn lint
